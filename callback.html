<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authorization code</title>
<style>body{font-family:system-ui,sans-serif;max-width:680px;margin:40px auto;padding:0 20px;line-height:1.6;color:#222}code{background:#f1efe8;padding:2px 6px;border-radius:4px;word-break:break-all}button{font-size:15px;padding:8px 14px;border:0;border-radius:8px;background:#0b62c4;color:#fff;cursor:pointer}.box{background:#f7f6f2;border:1px solid #e2e0d8;border-radius:10px;padding:16px;margin:16px 0}</style>
</head><body>
<h1>Authorization code</h1>
<p>Copy this value and paste it into the <code>authorize.py</code> prompt on your VM.</p>
<div class="box"><div id="state"></div><p style="margin:.5em 0 0"><strong>code:</strong></p><p><code id="code">(none found in URL)</code></p></div>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy code</button>
<script>
const p = new URLSearchParams(location.search);
const code = p.get('code'); const st = p.get('state'); const err = p.get('error');
if (code) document.getElementById('code').textContent = code;
if (err) document.getElementById('code').textContent = 'ERROR: ' + err + ' / ' + (p.get('error_description')||'');
document.getElementById('state').innerHTML = st ? '<strong>state:</strong> <code>'+st+'</code> (must match what authorize.py printed)' : '';
</script>
</body></html>
